  #     - uses: actions/checkout@v4
  #     - uses: pnpm/action-setup@v4
  #       with:
  #         version: 10
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version-file: frontend/.node-version
  #         cache: pnpm
  #         cache-dependency-path: frontend/pnpm-lock.yaml
